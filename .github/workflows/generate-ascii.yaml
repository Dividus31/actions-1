name: Generate Ascii Artwork

on: push

jobs:
  ascii_job:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repo
          uses: actions/checkout@v7

        - name: Install Cowsay CMD
          run: sudo apt-get install cowsay -y
        - name: Execute Cowsay CMD
          run: cowsay -f dog "Run for cover, I am a dog...RAWR" >> dog.txt
        - name: Test Textfile
          run: |
            grep -i  "dog" dog.txt
            cat dog.txt

        - name: List Repo Files
          run: ls -ltra

        #- name: Read File
      #    run: dog README.md