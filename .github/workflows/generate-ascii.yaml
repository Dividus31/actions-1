name: Generate Ascii Artwork

on: push

jobs:
  ascii_job:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repo
          uses: actions/checkout@v7

        - name: Install Cowsay CMD
          run: sudo apt-get install cowsay -y

        - name: Execute Cowsay CMD
          run: cowsay -f chicken "Run for cover, I am a chicken...RAWR" >> chicken.txt

        - name: Test Textfile
          run: |
            grep -i  "chicken" chicken.txt
            cat chicken.txt

        - name: List Repo Files
          run: ls -ltra

        #- name: Read File
      #    run:"chicken README.md