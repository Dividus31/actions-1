name: Generate Ascii Artwork

on: push

jobs:
  ascii_job:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repo
          uses: actions/checkout@v7

        - name: Install Cowsay CMD
          run: sudo apt-get install cowsay -y
        - name: Execute Cowsay CMD
          run: cowsay -f cat "Run for cover, I am a CAT...RAWR" >> cat.txt
        - name: Test Textfile
          run: |
            grep -i "cat" cat.txt
            cat cat.txt

        - name: List Repo Files
          run: ls -ltra

        #- name: Read File
      #    run: cat README.md